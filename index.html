<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0A4D9C">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Widget"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><title>The Widget</title>
<style>html,body{margin:0;background:#0A4D9C;color:#fff;font-family:-apple-system,system-ui,sans-serif}
#lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box}
#lock img{width:96px;height:96px;border-radius:22px}#lock h1{margin:0;font-size:22px;font-weight:800}
#lock input{width:100%;max-width:300px;padding:14px 16px;border-radius:14px;border:1px solid #ffffff33;background:#ffffff17;color:#fff;font-size:16px}
#lock button{width:100%;max-width:300px;padding:14px;border-radius:999px;border:0;background:#8FD3FF;color:#0A4D9C;font-weight:800;font-size:16px}
#msg{color:#cfe6ff;font-size:14px;min-height:18px}</style></head><body>
<div id="lock" hidden><img src="icon-192.png" alt=""><h1>The Widget</h1>
<form id="f" style="display:contents"><input id="pw" type="password" autocomplete="current-password" placeholder="Password"><button>Unlock</button></form><div id="msg"></div></div>
<div id="root"></div>
<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const db=()=>new Promise((r,j)=>{const q=indexedDB.open("widget",1);q.onupgradeneeded=()=>q.result.createObjectStore("k");q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const kget=async()=>{const d=await db();return new Promise(r=>{const q=d.transaction("k").objectStore("k").get("key");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})};
const kput=async k=>{const d=await db();return new Promise(r=>{const t=d.transaction("k","readwrite");t.objectStore("k").put(k,"key");t.oncomplete=r;t.onerror=r})};
let P;const payload=async()=>P||(P=await (await fetch("payload.json",{cache:"no-cache"})).json());
async function run(key){const p=await payload();const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(p.iv)},key,b64(p.ct));
 const s=document.createElement("script");s.src=URL.createObjectURL(new Blob([pt],{type:"text/javascript"}));document.getElementById("lock").remove();document.body.appendChild(s);}
async function derive(pw){const p=await payload();const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:b64(p.salt),iterations:p.iter},base,{name:"AES-GCM",length:256},false,["decrypt"]);}
(async()=>{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 try{const k=await kget();if(k){await run(k);return}}catch(e){}
 document.getElementById("lock").hidden=false;
 document.getElementById("f").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("msg");m.textContent="Unlocking…";
  try{const k=await derive(document.getElementById("pw").value);await run(k);await kput(k)}catch(e){m.textContent="Wrong password"}};})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
